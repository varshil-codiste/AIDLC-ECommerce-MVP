# Production docker-compose for self-hosted VPS (single-VM, rolling deploy).
# Images are pulled from GHCR. Secrets injected via environment or .env.prod file.
# Usage: docker compose -f docker-compose.prod.yml up -d

name: ecommmer-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    image: ghcr.io/${GHCR_REPO}/api:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=app
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      WEB_ORIGIN: ${WEB_ORIGIN}
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    image: ghcr.io/${GHCR_REPO}/web:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    networks: [frontend]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  backend:
  frontend:
