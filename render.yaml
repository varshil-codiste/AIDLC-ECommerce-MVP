# Render Blueprint for v1 deployment.
# Apply this in https://dashboard.render.com/select-repo?type=blueprint
#
# Provisions:
#   - PostgreSQL 16 with pgvector extension (managed by Render)
#   - Key Value (Redis-compatible)
#   - The NestJS API as a Docker web service
#
# Secrets you set in the dashboard after the first build:
#   - JWT_PRIVATE_KEY_B64, JWT_PUBLIC_KEY_B64 (see scripts/generate-jwt-keys.sh)
#   - LLM_API_KEY and LLM_PROVIDER_API_KEY (Anthropic key — same value for both)
#   - WEB_ORIGIN (set this to your Netlify URL once you have it, e.g.
#     https://codiste-commerce.netlify.app)

databases:
  - name: ecommmer-postgres
    databaseName: ecommmer
    user: ecommmer
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: ecommmer-redis
    plan: free
    ipAllowList: [] # allow all (Render private network only)

  - type: web
    name: ecommmer-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # Note: preDeployCommand is paid-tier-only. On the free tier, the
    # API's docker-entrypoint.sh runs migrations + extension setup on
    # every container start. The CREATE statements are idempotent.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommmer-postgres
          property: connectionString
      - key: AUDIT_DATABASE_URL
        fromDatabase:
          name: ecommmer-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecommmer-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: LLM_BUDGET_WEEKLY_USD
        value: "100"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # Secrets — set these in the Render dashboard after the first build
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
